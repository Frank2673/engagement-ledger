name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ========== 1. 单元测试（全部离线） ==========
  test:
    name: 单元测试与零依赖校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行测试套件
        run: node --test tests/

      - name: 零依赖与安全红线校验
        run: node scripts/check-zero-deps.mjs

  # ========== 2. 运营级校验 ==========
  # 这一整个作业就是一条命令：node scripts/verify.mjs
  #
  # 为什么不把校验写成这里的一堆 bash 片段：那些片段在本地跑不了（受限环境下
  # bash 起不来），于是只能"推上去等 CI 告诉你"。本仓库第一次提交就是这样挂的 ——
  # 两个失败全出在 YAML 里的 bash（一个 `{ ...; fi` 括号写错，一个用了不在
  # 授权范围内的主机名），与被测代码无关。搬到 Node 脚本后，同一条命令在本地与
  # CI 结果必然一致，本地就能先跑完再推。
  verify:
    name: 运营级校验（端到端 + 篡改检测 + 凭证守卫 + 红线）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运营级校验
        run: node scripts/verify.mjs --artifacts ./evidence

      - name: 上传证据产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engagement-evidence
          path: evidence/
          retention-days: 30
